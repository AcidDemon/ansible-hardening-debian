---
- name: Configure AIDE
  when: aide_enabled | bool
  block:
    - name: Install aide
      ansible.builtin.apt:
        name:
          - aide
          - aide-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Exclude churny container + app-data paths (before the DB is built)
      ansible.builtin.copy:
        dest: /etc/aide/aide.conf.d/90-stack-excludes
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for p in aide_exclude_paths %}
          !{{ p }}
          {% endfor %}

    - name: Initialise the AIDE database (slow; first run only)
      ansible.builtin.command: aideinit -y -f
      args:
        creates: /var/lib/aide/aide.db
      when: aide_init | bool

    - name: Deploy the daily check service + timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - aidecheck.service
        - aidecheck.timer
      notify: Reload systemd daemon

    - name: Enable the daily AIDE check timer
      ansible.builtin.systemd_service:
        name: aidecheck.timer
        enabled: true
        state: started
        daemon_reload: true
