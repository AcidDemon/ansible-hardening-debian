---
- name: Install the TOTP PAM module
  ansible.builtin.apt:
    name: libpam-google-authenticator
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ssh_2fa_totp_enabled | bool

- name: Back up /etc/pam.d/sshd once
  ansible.builtin.copy:
    src: /etc/pam.d/sshd
    dest: /etc/pam.d/sshd.orig
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  when: ssh_2fa_totp_enabled | bool

- name: Disable password (common-auth) in the sshd PAM stack — TOTP-only kbd-interactive
  ansible.builtin.replace:
    path: /etc/pam.d/sshd
    regexp: '^@include common-auth$'
    replace: '#@include common-auth  # disabled by ssh_2fa'
  when: ssh_2fa_totp_enabled | bool
  notify: Reload ssh

- name: Require TOTP for keyboard-interactive logins
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^auth\s+required\s+pam_google_authenticator\.so'
    line: "auth required pam_google_authenticator.so{{ ' nullok' if ssh_2fa_totp_nullok else '' }}"
    insertafter: BOF
    firstmatch: true
  when: ssh_2fa_totp_enabled | bool
  notify: Reload ssh

- name: Deploy the 2FA sshd drop-in
  ansible.builtin.template:
    src: 20-2fa.conf.j2
    dest: /etc/ssh/sshd_config.d/20-2fa.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload ssh
