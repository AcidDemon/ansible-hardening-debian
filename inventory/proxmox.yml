---
hardened_hosts:
  hosts:
    harden01:
      ansible_host: 192.0.2.10
      ansible_user: ansible
      ansible_ssh_private_key_file: files/ssh/deploy
      # -F /dev/null is REQUIRED on this control host: a NixOS libvirt ssh_config
      # drop-in has perms OpenSSH rejects; -F /dev/null makes ssh ignore system config.
      ansible_ssh_common_args: >-
        -F /dev/null -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
