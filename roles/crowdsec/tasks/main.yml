---
- name: Configure CrowdSec
  when: crowdsec_enabled | bool
  block:
    - name: Upstream engine repository
      when: crowdsec_upstream_repo | bool
      block:
        - name: The deb822_repository module needs python3-debian
          ansible.builtin.apt:
            name: python3-debian
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: CrowdSec apt repository
          ansible.builtin.deb822_repository:
            name: crowdsec
            types: deb
            uris: https://packagecloud.io/crowdsec/crowdsec/any
            suites: any
            components: main
            signed_by: https://packagecloud.io/crowdsec/crowdsec/gpgkey

        # Only the engine comes from there. Everything else in the repo (its
        # own bouncer packages among them) stays below Debian's.
        - name: Pin only the engine to the CrowdSec repository
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/crowdsec
            content: |
              Package: *
              Pin: origin packagecloud.io
              Pin-Priority: 100

              Package: crowdsec
              Pin: origin packagecloud.io
              Pin-Priority: 990
            mode: "0644"

        # The unattended-upgrades origin list only matches Debian.
        - name: Let unattended-upgrades update the engine
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/52unattended-upgrades-crowdsec
            content: |
              Unattended-Upgrade::Origins-Pattern:: "site=packagecloud.io";
            mode: "0644"

        # state=latest: present would leave an installed Debian 1.4.6 alone.
        - name: Upstream engine
          ansible.builtin.apt:
            name: crowdsec
            state: latest # noqa: package-latest
            update_cache: true
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: cs_upstream

        # A 1.4.6 process still running reads the new hub on its next reload
        # and dies on the newer scenario format.
        - name: Restart into the new engine
          ansible.builtin.systemd_service:
            name: crowdsec
            state: restarted
          when: cs_upstream is changed # noqa: no-handler (must run before the hub tasks, not at the end)

        # Debian's engine linked its hub items into /var/lib/crowdsec/hub; the
        # upstream one keeps its hub in /etc/crowdsec/hub and treats those
        # links as hand-made "local" items it never updates. The collections
        # below put the current items back.
        - name: Drop links into Debian's old hub
          ansible.builtin.command:
            argv: [find, /etc/crowdsec, -lname, "/var/lib/crowdsec/hub/*", -print, -delete]
          register: cs_old_links
          changed_when: cs_old_links.stdout | length > 0
          notify: Restart crowdsec

    - name: Install crowdsec and the firewall bouncer (native Debian packages)
      ansible.builtin.apt:
        name:
          - crowdsec
          - crowdsec-firewall-bouncer
        state: present
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure the firewall bouncer uses the nftables backend
      ansible.builtin.lineinfile:
        path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
        regexp: '^mode:'
        line: "mode: nftables"
        backup: true
      notify: Restart crowdsec-firewall-bouncer

    - name: Whitelist management networks
      ansible.builtin.template:
        src: whitelist.yaml.j2
        dest: /etc/crowdsec/parsers/s02-enrich/whitelist.yaml
        owner: root
        group: root
        mode: "0644"
      notify: Reload crowdsec

    - name: Update CrowdSec hub index
      ansible.builtin.command: cscli hub update
      register: cs_hub
      changed_when: "'hub index is up to date' not in cs_hub.stderr"

    - name: Check CrowdSec collection status
      ansible.builtin.command: "cscli collections inspect {{ item }} -o json"
      register: cs_inspect
      changed_when: false
      failed_when: false
      loop: "{{ crowdsec_collections }}"

    - name: Install CrowdSec collections
      ansible.builtin.command: "cscli collections install {{ item.item }} --force"
      register: cs_coll
      changed_when: true
      failed_when: cs_coll.rc != 0
      loop: "{{ cs_inspect.results }}"
      vars:
        # Guard against unparseable cscli output (empty stdout, schema changes, etc.).
        # A parse failure yields an empty dict, which triggers a (forced) reinstall
        # rather than crashing the loop with a Jinja2 error.
        _cs_info: "{{ (item.stdout | default('') | from_json) if (item.stdout | default('')) | length > 0 else {} }}"
      when: >
        item.rc != 0 or
        not _cs_info.get('up_to_date', false) or
        _cs_info.get('tainted', false)
      notify: Reload crowdsec

    - name: Enable and start crowdsec + bouncer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - crowdsec
        - crowdsec-firewall-bouncer

    - name: Enroll the engine in the CrowdSec console
      ansible.builtin.command: "cscli console enroll {{ vault_crowdsec_enroll_key }}"
      register: cs_enroll
      no_log: true
      changed_when: >
        'Enrolled' in cs_enroll.stdout or
        ('enroll' in cs_enroll.stdout and 'already' not in cs_enroll.stdout)
      failed_when:
        - cs_enroll.rc != 0
        - "'already enrolled' not in (cs_enroll.stdout + cs_enroll.stderr)"
      when:
        - crowdsec_console_enroll | bool
        - vault_crowdsec_enroll_key | default('') | length > 0
      notify: Restart crowdsec
