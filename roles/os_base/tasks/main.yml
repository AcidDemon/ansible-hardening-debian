---
- name: Assert a primary IPv4 address is present
  ansible.builtin.assert:
    that:
      - ansible_facts['default_ipv4'] is defined
      - ansible_facts['default_ipv4']['address'] is defined
    fail_msg: "os_base requires a primary IPv4; configure networking first."
    success_msg: "Primary IPv4: {{ ansible_facts['default_ipv4']['address'] }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ os_base_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Write /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
    backup: true
